services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb -p local/blossom || true;
      "
    restart: "no"

  blossom:
    build: .
    image: ghcr.io/xdzczk/smartflowsocial-blossom
    restart: unless-stopped
    environment:
      DB_PATH: /data
      PORT: "5050"
      NODE_ENV: development
      R2_BUCKET: blossom
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin
      SFS_UPLOAD_TOKEN_SECRET: dev-upload-token-secret
      BLOSSOM_PUBLIC_URL: http://localhost:5050
      AUTH_TOLERANCE_SECONDS: "60"
    ports:
      - "5050:5050"
    volumes:
      - blossom:/data
    depends_on:
      minio-init:
        condition: service_completed_successfully

volumes:
  minio: {}
  blossom: {}
